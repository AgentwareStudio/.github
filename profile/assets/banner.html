<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(inter.woff2);font-weight:100 900}
@font-face{font-family:Mono;src:url(jetbrains-mono.woff2);font-weight:100 800}
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07080C;--fg:#F4F3EF;--slate:#9BA3B8;--dim:#7A8196;--muted:#555C70;--hair:rgba(155,163,184,.14);--ink:#F4F3EF}
body.light{--bg:#F4F3EF;--fg:#090A0F;--slate:#4A5060;--dim:#5E6475;--muted:#8A8F9C;--hair:rgba(9,10,15,.12);--ink:#090A0F}
body{width:1600px;height:600px;background:var(--bg);color:var(--fg);font-family:Inter,sans-serif;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.0) 38%,rgba(0,0,0,.75) 70%,#000 100%);opacity:.7}
.wrap{position:absolute;left:96px;top:80px;right:96px;bottom:76px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:22px}
.mark{width:80px;height:80px}.mark .ink{fill:var(--ink)}
.eyebrow{font-family:Mono;font-size:18px;letter-spacing:.2em;color:var(--dim)}
h1{margin-top:44px;font-size:100px;font-weight:500;letter-spacing:-.035em;line-height:1}
h1 span{color:var(--dim)}
.sub{margin-top:24px;font-size:30px;font-weight:300;color:var(--slate);letter-spacing:-.005em}
.foot{margin-top:auto;padding-top:36px;display:flex;gap:34px;font-family:Mono;font-size:17px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.foot b{color:var(--slate);font-weight:400}
/* right: authorized boundary with an adaptive path that ends in a verifiable outcome */
.fig{position:absolute;right:96px;top:130px;width:440px;height:340px}
.fig .br{fill:none;stroke:var(--slate);stroke-width:2.6;opacity:.8}
.fig .node{fill:var(--bg);stroke:var(--slate);stroke-width:1.6}
.fig .path{fill:none;stroke:var(--fg);stroke-width:2.6}
.fig .alt{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:4 6}
.fig .lbl{font-family:Mono;font-size:14px;letter-spacing:.16em;fill:var(--muted)}
</style></head><body>
<div class="grid"></div>
<svg class="fig" viewBox="0 0 440 340">
  <path class="br" d="M70,24 L40,24 L22,42 L22,298 L40,316 L70,316"/>
  <path class="br" d="M370,24 L400,24 L418,42 L418,298 L400,316 L370,316"/>
  <text class="lbl" x="220" y="14" text-anchor="middle">AUTHORIZED BOUNDARY</text>
  <polyline class="alt" points="70,230 150,230 205,150"/>
  <polyline class="path" points="70,230 150,230 205,262 290,262 345,118"/>
  <circle class="node" cx="70" cy="230" r="6"/><circle class="node" cx="150" cy="230" r="6"/>
  <circle class="node" cx="205" cy="150" r="6" style="stroke:var(--muted)"/>
  <path d="M199,144 L211,156 M211,144 L199,156" stroke="var(--muted)" stroke-width="1.4"/>
  <circle class="node" cx="205" cy="262" r="6"/><circle class="node" cx="290" cy="262" r="6"/>
  <circle cx="345" cy="118" r="11" fill="#FF4F00"/>
  <text class="lbl" x="70" y="258" text-anchor="middle">INTENT</text>
  <text class="lbl" x="205" y="290" text-anchor="middle">ADAPT</text>
  <text class="lbl" x="330" y="122" text-anchor="end">VERIFIED OUTCOME</text>
</svg>
<div class="wrap">
  <div class="top"><svg viewBox="0 0 100 100" class="mark"><defs><clipPath id="c"><path d="M53.807,0 L100,0 L100,71.013 L32.328,71.013 Z"/></clipPath></defs><path class="ink" d="M20,16 L24.679,16 L24.679,22.6 L20.6,22.6 L20.6,77.4 L24.679,77.4 L24.679,84 L20,84 L14,78 L14,22 Z"/><path class="ink" d="M80,16 L75.321,16 L75.321,22.6 L79.4,22.6 L79.4,77.4 L75.321,77.4 L75.321,84 L80,84 L86,78 L86,22 Z"/><path class="ink" d="M32.328,71.013 L45.039,28.987 L54.961,28.987 L67.672,71.013 L57.751,71.013 L50,45.387 L42.249,71.013 Z"/><path class="ink" clip-path="url(#c)" d="M35.882,70.779 L70.280,47.581 L66.852,42.497 L32.454,65.695 Z"/><circle cx="68.566" cy="45.039" r="6.132" fill="#FF4F00"/></svg><span class="eyebrow">[ A↗• ] AGENTWARE STUDIO</span></div>
  <h1>From Interface<br><span>to Intent</span></h1>
  <p class="sub">Software that acts on intent.</p>
  <div class="foot"><b>agentware.studio</b><span>Research</span><span>Open Curriculum</span><span>Tools</span></div>
</div>
</body></html>
